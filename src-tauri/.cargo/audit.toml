# cargo-audit configuration (run by CI in this directory).

[advisories]
ignore = [
    # libsqlite3-sys < 0.39 bundles SQLite < 3.54.0, which can return stale
    # memory when opening a crafted database with a mismatched `-wal` file.
    # Exploiting it requires planting both files where the victim opens them.
    # Bucklane only opens its own database in the per-user app data folder,
    # so an attacker would already need that user's access. The fix can't be
    # taken yet: sqlx-sqlite 0.9.0 (latest) requires libsqlite3-sys < 0.38.
    # Remove this once sqlx allows libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459",
]
