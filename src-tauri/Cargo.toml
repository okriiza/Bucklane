[package]
name = "bucklane"
version = "0.4.0"
description = "Desktop S3 storage manager"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "bucklane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
http-body = "1"
futures-util = "0.3"
mime_guess = "2"
base64 = "0.22"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
# No `zip` feature: v2 updater artifacts are the installers themselves, not archives.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
aws-sdk-s3 = { version = "1.152", default-features = false, features = ["rt-tokio", "default-https-client", "http-1x", "behavior-version-latest"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = "4.2"
url = "2.5"
uuid = { version = "1.28", features = ["v7"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
