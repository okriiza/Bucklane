# Local S3-compatible storage for integration tests (TSD §13.2).
#   docker compose up -d minio
#   BUCKLANE_MINIO_ENDPOINT=http://localhost:9000 cargo test --manifest-path src-tauri/Cargo.toml
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bucklane-test
      MINIO_ROOT_PASSWORD: bucklane-test-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15
