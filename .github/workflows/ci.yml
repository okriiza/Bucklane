name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Shipped dependencies only; dev tooling advisories are reviewed by hand.
      - name: Audit production dependencies
        run: pnpm audit --prod
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Production build
        run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; "unmaintained" notices are reported only.
      - run: cargo audit
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Start S3-compatible server for integration tests
        working-directory: .
        run: |
          docker compose up -d s3
          timeout 60 sh -c 'until curl -sf http://localhost:9100/health; do sleep 1; done'
      - run: cargo test
        env:
          BUCKLANE_S3_TEST_ENDPOINT: http://localhost:9100
      - name: Check generated TypeScript bindings are committed
        run: git diff --exit-code -- ../src/services/tauri/bindings.ts
