name: Release

# Builds installers for every platform and attaches them to a draft GitHub
# release. Triggered by pushing a version tag, e.g. `git push origin v0.1.0`.
# Review the draft on GitHub, then publish it. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            target: ""
            args: ""
          - name: Linux x64
            platform: ubuntu-22.04
            target: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Bucklane ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## Downloads

            | Platform | File |
            | --- | --- |
            | macOS (Apple Silicon) | `Bucklane_*_aarch64.dmg` |
            | macOS (Intel) | `Bucklane_*_x64.dmg` |
            | Windows | `Bucklane_*_x64-setup.exe` or `.msi` |
            | Linux | `.AppImage`, `.deb`, or `.rpm` |

            ### First launch

            These builds are not code-signed yet.

            - **macOS:** if macOS says the app is damaged or from an unidentified developer, run `xattr -cr /Applications/Bucklane.app` once, then open it.
            - **Windows:** if SmartScreen appears, choose **More info → Run anyway**.
            - **Linux:** saving connections requires a Secret Service provider such as GNOME Keyring or KWallet.
